<div id="toolbar-row">
    <div class="toolbar-things"></div>
    <span id="current-folio-label"></span>
    <div id="manuscript-folio-advancer-container"></div>
    <form id="goto-folio-form" autocomplete="off">
        <input id="goto-folio-input" type="text" class="form-control form-control-sm" placeholder="Go to folio">
        <button type="submit" class="btn btn-secondary btn-sm">Go</button>
        <div id="goto-folio-suggestions"></div>
    </form>
    <div id="manuscript-info-target">
        <button type="button" class="btn btn-link btn-sm">Manuscript info</button>
    </div>
</div>
<% if (viewer_warning) { %>
<div class="alert alert-warning alert-dismissible fade show" role="alert" style="margin: 1rem; margin-bottom: 0;">
    <strong>Notice:</strong> <%- viewer_warning %>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<% } %>
<div class="manuscript-columns propagate-height">
    <div id="diva-column" class="propagate-height"></div>
    <div id="manuscript-data-column" class="propagate-height">
        <div id="manuscript-nav-container">
            <ul class="nav nav-tabs nav-justified mt-0">
                <li class="nav-item">
                    <a id="manuscript-nav-folio-number"
                       class="nav-link active"
                       data-bs-target="#manuscript-folio-pane"
                       data-bs-toggle="tab"
                       type="button"
                       role="tab"
                       aria-controls="manuscript-folio-pane"
                       aria-selected="true"></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" 
                    data-bs-target="#manuscript-search-pane" 
                    data-bs-toggle="tab" 
                    type="button" 
                    role="tab" 
                    aria-controls="manuscript-search-pane" 
                    aria-selected="false">Search Manuscript</a>
                </li>
            </ul>
        </div>
        <div id="manuscript-data-container" class="propagate-height">
            <div class="resizer">
                <div class="prong"></div>
                <div class="prong"></div>
            </div>
            <div class="tab-content ps-2">
                <div role="tabpanel"
                    class="tab-pane active"
                    id="manuscript-folio-pane">
                    <div id="folio"></div>
                </div>
                <div role="tabpanel"
                    class="tab-pane"
                    id="manuscript-search-pane">
                    <div id="manuscript-search"></div>
                </div>
            </div>
        </div>
    </div>
</div>
