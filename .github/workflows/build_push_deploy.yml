name: Build, Push, and Deploy

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: ./app/Dockerfile
            image: cantus-app
            build_args: DEVELOPMENT=False
          - name: nginx
            context: .
            file: ./nginx/Dockerfile
            image: cantus-nginx
          - name: solr
            context: ./solr
            file: ./solr/Dockerfile
            image: cantus-solr
          - name: cantaloupe
            context: ./cantaloupe
            file: ./cantaloupe/Dockerfile
            image: cantus-cantaloupe

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}-latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Compute image tag
        id: tag
        run: |
          BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "value=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update production images
        run: |
          TAG=${{ steps.tag.outputs.value }}
          OWNER=${{ github.repository_owner }}
          kubectl set image deployment/app app=ghcr.io/${OWNER}/cantus-app:${TAG} -n cantus-ultimus
          kubectl set image deployment/celery celery=ghcr.io/${OWNER}/cantus-app:${TAG} -n cantus-ultimus
          kubectl set image deployment/nginx nginx=ghcr.io/${OWNER}/cantus-nginx:${TAG} -n cantus-ultimus
          kubectl set image deployment/cantaloupe cantaloupe=ghcr.io/${OWNER}/cantus-cantaloupe:${TAG} -n cantus-ultimus
          kubectl set image statefulset/solr solr=ghcr.io/${OWNER}/cantus-solr:${TAG} -n cantus-ultimus

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/app -n cantus-ultimus --timeout=300s
          kubectl rollout status deployment/nginx -n cantus-ultimus --timeout=300s
          kubectl rollout status deployment/celery -n cantus-ultimus --timeout=300s

  deploy-staging:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Compute image tag
        id: tag
        run: |
          BRANCH=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "value=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update staging images
        run: |
          TAG=${{ steps.tag.outputs.value }}
          OWNER=${{ github.repository_owner }}
          kubectl set image deployment/app-staging app=ghcr.io/${OWNER}/cantus-app:${TAG} -n cantus-ultimus
          kubectl set image deployment/celery-staging celery=ghcr.io/${OWNER}/cantus-app:${TAG} -n cantus-ultimus
          kubectl set image deployment/nginx-staging nginx=ghcr.io/${OWNER}/cantus-nginx:${TAG} -n cantus-ultimus
          kubectl set image deployment/cantaloupe-staging \
            cantaloupe=ghcr.io/${OWNER}/cantus-cantaloupe:${TAG} -n cantus-ultimus
          kubectl set image statefulset/solr-staging solr=ghcr.io/${OWNER}/cantus-solr:${TAG} -n cantus-ultimus

      - name: Wait for staging rollouts
        run: |
          kubectl rollout status deployment/app-staging -n cantus-ultimus --timeout=300s
          kubectl rollout status deployment/nginx-staging -n cantus-ultimus --timeout=300s
          kubectl rollout status deployment/celery-staging -n cantus-ultimus --timeout=300s