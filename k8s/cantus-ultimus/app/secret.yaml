apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cantus-ultimus
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<value>"
  # Must match POSTGRES_PASSWORD in k8s/postgres/secret.yaml
  # Duplicated here because Secrets are namespace-scoped.
  # Consider ExternalSecrets Operator or Vault to manage this from a single source.
  POSTGRES_PASSWORD: "<value>"
  RABBIT_PASSWORD: "<value>"