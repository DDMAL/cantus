apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: cantus-ultimus
spec:
  serviceName: solr
  replicas: 1
  selector:
    matchLabels:
      app: solr
  template:
    metadata:
      labels:
        app: solr
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: solr
        image: ghcr.io/ddmal/cantus-solr:main-latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8983
        env:
        - name: SOLR_SECURITY_MANAGER_ENABLED
          value: "false"
        volumeMounts:
        # Mount only the index data directory so the image-baked core config
        # at /var/solr/data/cantus_ultimus_1/conf/ is not shadowed by the PVC.
        - name: solr-data
          mountPath: /var/solr/data/cantus_ultimus_1/data
        # startupProbe holds liveness/readiness off until the core is actually
        # serving. Opening a cold core takes ~100s on the larger index, and far
        # longer when a deploy keeps the node's disk busy: a 300s budget once
        # killed a load still in progress, so it has 10 minutes.
        # timeoutSeconds is set explicitly everywhere: the 1s default is under
        # the ~800ms a cold admin/ping takes (warm is ~4ms).
        startupProbe:
          httpGet:
            path: /solr/cantus_ultimus_1/admin/ping?wt=json
            port: 8983
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /solr/cantus_ultimus_1/admin/ping?wt=json
            port: 8983
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /solr/cantus_ultimus_1/admin/ping?wt=json
            port: 8983
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "150m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "1536Mi"
      # Polls Solr's metrics API over localhost every SCRAPE_INTERVAL seconds and
      # serves the result on :9854. It ships in the Solr image, so it is set to
      # the same tag as the solr container.
      #
      # It must not poll while the core is loading: reading the core's metrics
      # then opens a second searcher, which deadlocks the load until the
      # startupProbe kills Solr (seen 3 times, 7-11 minutes without search).
      # So it only runs while the core answers its ping, and is stopped as
      # soon as Solr's port closes (the solr container restarting in the pod).
      - name: solr-exporter
        image: ghcr.io/ddmal/cantus-solr:main-latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        - |
          PING="$SOLR_URL/cantus_ultimus_1/admin/ping?wt=json"
          trap 'kill "$pid" 2>/dev/null; exit 0' TERM INT
          while true; do
            until curl -sf -m 5 -o /dev/null "$PING"; do sleep 5; done
            echo "Solr core is up; starting solr-exporter"
            /opt/solr/modules/prometheus-exporter/bin/solr-exporter &
            pid=$!
            # curl exits 7 when nothing listens on the port: the solr
            # container is restarting and will load the core again.
            while kill -0 "$pid" 2>/dev/null; do
              curl -s -m 5 -o /dev/null "$SOLR_URL/"
              [ $? -eq 7 ] && break
              sleep 2
            done
            echo "Solr is down; stopping solr-exporter until the core is back"
            kill "$pid" 2>/dev/null; wait "$pid"
          done
        ports:
        - name: metrics
          containerPort: 9854
        env:
        - name: PORT
          value: "9854"
        - name: SOLR_URL
          value: "http://localhost:8983/solr"
        - name: CONFIG_FILE
          value: "/opt/solr/modules/prometheus-exporter/conf/solr-exporter-config.xml"
        - name: SCRAPE_INTERVAL
          value: "60"
        - name: NUM_THREADS
          value: "2"
        - name: JAVA_HEAP
          value: "128m"
        # No readiness probe: a sidecar's readiness is the pod's, and an
        # unready exporter must not take Solr out of the solr Service.
        resources:
          requests:
            cpu: "25m"
            memory: "192Mi"
          limits:
            cpu: "250m"
            memory: "320Mi"
      volumes:
      - name: solr-data
        persistentVolumeClaim:
          claimName: solr-data-pvc