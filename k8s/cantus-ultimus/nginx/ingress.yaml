apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cantus-ingress
  namespace: cantus-ultimus
  annotations:
    # Match the gunicorn/nginx proxy timeouts (600s) to avoid 504s on slow requests
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  rules:
  - host: cantus.simssa.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 8000