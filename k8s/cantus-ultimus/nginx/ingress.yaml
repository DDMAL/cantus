apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cantus-ingress
  namespace: cantus-ultimus
  annotations:
    # Match the gunicorn/nginx proxy timeouts (600s) to avoid 504s on slow requests
    traefik.ingress.kubernetes.io/router.middlewares: cantus-ultimus-timeout@kubernetescrd
spec:
  rules:
  - host: cantus-k3s.simssa.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx
            port:
              number: 8000