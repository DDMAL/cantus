apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cantus-ultimus-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: nginx
        image: ghcr.io/ddmal/cantus-nginx:develop-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: manifests
          mountPath: /code/manifests
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      volumes:
      - name: manifests
        persistentVolumeClaim:
          claimName: cantaloupe-manifests-pvc