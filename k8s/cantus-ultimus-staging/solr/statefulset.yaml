apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr-staging
  namespace: cantus-ultimus
spec:
  serviceName: solr-staging
  replicas: 1
  selector:
    matchLabels:
      app: solr-staging
  template:
    metadata:
      labels:
        app: solr-staging
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: solr
        image: ghcr.io/ddmal/cantus-solr:main-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8983
        env:
        - name: SOLR_SECURITY_MANAGER_ENABLED
          value: "false"
        volumeMounts:
        - name: solr-data
          mountPath: /var/solr/data/cantus_ultimus_1/data
        # startupProbe holds liveness/readiness off until the core is actually
        # serving. Opening a cold core takes ~100s on the larger index, which
        # is close enough to liveness's 60s+3x20s budget to risk a kill loop.
        # timeoutSeconds is set explicitly everywhere: the 1s default is under
        # the ~800ms a cold admin/ping takes (warm is ~4ms).
        startupProbe:
          httpGet:
            path: /solr/cantus_ultimus_1/admin/ping?wt=json
            port: 8983
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /solr/cantus_ultimus_1/admin/ping?wt=json
            port: 8983
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /solr/cantus_ultimus_1/admin/ping?wt=json
            port: 8983
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1536Mi"
      volumes:
      - name: solr-data
        persistentVolumeClaim:
          claimName: solr-data-staging-pvc
