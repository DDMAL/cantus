apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-staging
  namespace: cantus-ultimus
data:
  APP_VERSION: "3.2-0.12.1"
  DEVELOPMENT: "False"
  POSTGRES_DB: "cantus_db"
  POSTGRES_USER: "cantus_admin"
  POSTGRES_HOST: "postgres-cantus-ultimus-staging.postgres.svc.cluster.local"
  RABBIT_USER: "cantus_admin"
  RABBIT_VHOST: "cantus_ultimus_staging"
  RABBIT_HOST: "rabbitmq-staging"
  SOLR_HOST: "solr-staging"
  # The in-cluster FQDN is needed by Mothra's MEI deposit calls, which reach
  # Django directly rather than through nginx: nginx's default_server returns
  # 444 for any Host outside its server_name list, and a cross-namespace
  # caller can only use the FQDN, never the bare Service name.
  EXTRA_ALLOWED_HOSTS: "app-staging,cantus.staging.simssa.ca,app-staging.cantus-ultimus.svc.cluster.local"
  # Live tree of MEI files read by index_manuscript_mei, backed by the
  # cantus-mei-files PVC (NFS). Mounted at this path in app and celery.
  MEI_FILES_DIR: "/code/mei-files"
